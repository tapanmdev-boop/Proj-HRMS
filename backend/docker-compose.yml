# Local development stack. The explicit project name keeps this stack from
# colliding with other compose projects that live in a folder named "backend".
name: hrms

services:
  # NestJS API (optional; you can also run `npm run start:dev` on the host)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: hrms-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD:-hrms_dev_password}@postgres:5432/${POSTGRES_DB:-hrms}?schema=public
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:${API_PORT:-3001}:${PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    image: postgres:15
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: hrms-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  # S3-compatible object storage for documents
  minio:
    image: minio/minio
    container_name: hrms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrms_minio_dev_password}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
